<!DOCTYPE html>
<html lang="en">
<head>
  <title>Forgot Password page</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="../static/css/login.css">

  <!-- Custom CSS -->
  <style>
    body {
      background-size: cover;
      background-position: center;
      height: 100vh; /* Set the body height to full viewport height */
      display: flex;
      justify-content: center; /* Center align content horizontally */
      align-items: center; /* Center align content vertically */
      font-family: 'Times New Roman', Times, serif;
      font-weight: bolder;
    }

    .register-container {
      background-color: rgba(255, 255, 255, 0.1); /* White background for register container with some opacity */
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.5); /* Adding a subtle shadow */
    }
  </style>
</head>
<body style="background-image: url('{{ url_for('static', filename='loginbg.jpg') }}');">
        <div class="log">
          <form action="/forgotpassword" method="post">
              <h1>Forgot Password</h1>
              <div class="input">
                  <input type="email" placeholder="Email" name="email" required>
                  <i class='bx bxs-user'></i>
              </div>
              <div class="input">
                  <input type="password" placeholder="Enter New Password" name="new_password" required>
                  <i class='bx bxs-lock'></i>
                  <div class="input">
                    <input type="password" placeholder="Confirm Password" name="confirm_password" required>
                    <i class='bx bxs-lock'></i>
              </div>
              <button type="submit" class="btn">Submit</button>
  
          </form>
      </div>
    </div>
  </div>
</div>

<script>
  // Get the input fields
  var New_Password = document.getElementById('new_password');
  var Confirm_Password = document.getElementById('confirm_password');

  // Add event listener to new password input to copy its value to confirm password input
  New_Password.addEventListener('input', function() {
    Confirm_Password.value = New_Password.value;
  });
</script>

</body>
</html>
